name: Kira 12 camera beauty live release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira120-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kira 12 production patch
        run: python .github/kira120_release.py

      - name: JavaScript syntax
        run: node --check app.js

      - name: Production regression audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, struct
          from pathlib import Path

          required = [
              'index.html','style.css','app.js','manifest.json','service-worker.js','sw.js',
              'icons/icon-32.png','icons/icon-48.png','icons/icon-72.png','icons/icon-96.png',
              'icons/icon-128.png','icons/icon-144.png','icons/icon-152.png','icons/icon-180.png',
              'icons/icon-192.png','icons/icon-384.png','icons/icon-512.png',
              'icons/icon-192-maskable.png','icons/icon-512-maskable.png','assets/fonts1989/manifest.json'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, f'Missing production files: {missing}'

          index=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert sw == Path('sw.js').read_text(encoding='utf-8'), 'service-worker.js and sw.js diverged'
          assert 'maximum-scale=1' in index and 'user-scalable=no' in index, 'iPhone zoom guard missing'
          assert './app.js?v=12.0.0' in index and './style.css?v=12.0.0' in index
          assert 'BUILD 12.0' in index

          # DOM ID duplication is a common interaction-layer failure.
          ids=re.findall(r'\bid="([^"]+)"', index)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'Duplicate DOM ids: {dup}'

          critical=[
              'startCamera','stopCamera','captureLivePhoto','captureKiraLivePhoto','captureLiveMotionClip',
              'startVideoRecording','stopVideoRecording','renderRolls','openPhotoModal','safeOpenPhotoModal',
              'applyBeautyPass','toggleCameraImmersive','toggleLivePhoto','draw1989Text','renderInstantCaptionBlob',
              'shareQueuedPhotos','saveAllCurrent','preventZoom'
          ]
          for fn in critical:
              assert re.search(rf'function\s+{re.escape(fn)}\s*\(', app), f'Missing critical function: {fn}'

          assert "['Beauty Only','Beauty'" in app, 'Beauty Only preset missing'
          assert 'sm*.62+bl*.16+bl*.84*blemishTarget' in app, 'strong beauty pass missing'
          assert 'sourceTrack.clone()' in app, 'Kira Live must reuse the existing stream via clone'
          assert 'liveCaptureBusy' in app, 'Kira Live concurrency guard missing'
          assert app.count('navigator.mediaDevices.getUserMedia(constraints)') == 1, 'unexpected extra video getUserMedia path'
          assert 'camera-immersive' in css and 'position:fixed!important' in css, 'immersive camera CSS missing'
          assert '#livePhotoBtn.active' in css and '.live-roll-badge' in css

          # 1989 mapping regression: full digits and ASCII letters must remain packaged.
          glyph=json.loads(Path('assets/fonts1989/manifest.json').read_text(encoding='utf-8'))
          chars=set(glyph.keys()) if isinstance(glyph, dict) else set()
          expected=set('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz')
          assert expected.issubset(chars), f'1989 glyph manifest missing: {sorted(expected-chars)}'
          for sample in ('1989','0123456789','ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'):
              assert all(ch in chars for ch in sample), f'1989 sample failed: {sample}'

          # Validate manifest JSON and every declared icon path.
          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          for icon in manifest.get('icons',[]):
              src=icon.get('src','').lstrip('./')
              assert Path(src).is_file(), f'Manifest icon missing: {src}'

          # Stable icon filenames must have the actual PNG dimensions in their names.
          def png_size(path):
              data=Path(path).read_bytes()[:24]
              assert data[:8] == b'\x89PNG\r\n\x1a\n', f'Not PNG: {path}'
              return struct.unpack('>II', data[16:24])
          for size in (32,48,72,96,128,144,152,180,192,384,512):
              p=f'icons/icon-{size}.png'
              assert png_size(p)==(size,size), f'Wrong dimensions: {p} {png_size(p)}'
          assert png_size('icons/icon-192-maskable.png')==(192,192)
          assert png_size('icons/icon-512-maskable.png')==(512,512)

          assert "kira-build12-camera-beauty-live-20260814" in sw
          print('Static/runtime dependency regression audit passed.')
          PY

      - name: PWA local HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m http.server 8765 >/tmp/kira-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/index.html -o /tmp/kira-index.html
          curl -fsS http://127.0.0.1:8765/app.js -o /tmp/kira-app.js
          curl -fsS http://127.0.0.1:8765/style.css -o /tmp/kira-style.css
          curl -fsS http://127.0.0.1:8765/service-worker.js -o /tmp/kira-sw.js
          grep -q 'BUILD 12.0' /tmp/kira-index.html
          grep -q 'Beauty Only' /tmp/kira-app.js
          grep -q 'captureKiraLivePhoto' /tmp/kira-app.js
          grep -q 'camera-immersive' /tmp/kira-style.css
          grep -q 'kira-build12-camera-beauty-live-20260814' /tmp/kira-sw.js

      - name: Commit Kira 12 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Kira 12: strengthen beauty and add immersive Live camera"
          git push origin HEAD:main
