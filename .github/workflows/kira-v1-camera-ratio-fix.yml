name: Kira v1.0 camera ratio fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch production files
        run: |
          echo '  ' | base64 -d > /tmp/kira_patch.py
          python3 /tmp/kira_patch.py
      - name: QA
        run: |
          node --check app.js
          cmp -s service-worker.js sw.js
          echo '' | base64 -d > /tmp/kira_qa.py
          python3 /tmp/kira_qa.py
          grep -q 'v1.0 CAMERA RATIO PREVIEW FIX' style.css
          grep -q 'app.js?v=1.0.2' index.html
          grep -q 'Current version</span><b>v1.0</b>' index.html
          grep -q 'liveBeautyCanvas' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js style.css index.html service-worker.js sw.js
          git diff --cached --check
          git commit -m 'Kira v1.0: fix live camera ratio preview'
          git push origin main
