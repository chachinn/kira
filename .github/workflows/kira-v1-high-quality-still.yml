name: Kira v1.0 high-quality still capture

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply production patch
        run: python .github/scripts/kira_v1_high_quality_still.py
      - name: QA high-quality still capture and critical regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          cmp -s service-worker.js sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text()
          idx=Path('index.html').read_text()
          css=Path('style.css').read_text()
          sw=Path('service-worker.js').read_text()

          def need(x,msg):
              if not x: raise SystemExit(msg)

          # Release/cache coherence.
          need('v1.0' in idx,'public v1.0 label missing')
          for s in ['manifest.json?v=1.0.8','style.css?v=1.0.8','app.js?v=1.0.8']:
              need(s in idx,f'missing {s}')
          need("service-worker.js?v=1.0.8" in app,'SW registration version mismatch')
          need("kira-v1-0-high-quality-still-20260817" in sw,'cache key missing')

          # Photo quality configuration.
          need("photoQuality:'high'" in app,'High photo-quality default missing')
          need('id="settingPhotoQuality"' in idx,'photo-quality setting UI missing')
          for v in ['standard','high','max']:
              need(f'value="{v}"' in idx,f'photo-quality option {v} missing')
          need("maxSide:2048" in app and "maxSide:3072" in app and "maxSide:3840" in app,'quality tier dimensions missing')
          need("jpeg:.93" in app and "jpeg:.96" in app and "jpeg:.97" in app,'quality tier JPEG settings missing')

          # Still-photo-first architecture. It must feature-detect and fall back safely.
          need("typeof ImageCapture==='function'" in app,'ImageCapture feature detection missing')
          need('new ImageCapture(track)' in app and '.takePhoto()' in app,'true still-photo path missing')
          need('function captureBestStill' in app,'best-still helper missing')
          need('function cropCameraSourceToRatio' in app,'high-resolution crop helper missing')
          need('function prepareStillForDevelop' in app,'non-continuous still preparation missing')
          need('captureCanvasForRatio(video,profile.maxSide)' in app,'video-frame fallback missing')
          need("photoQuality:state.settings.photoQuality||'high'" in app,'queued capture quality snapshot missing')
          need('task.needsCrop' in app and "task.facing==='user'" in app and 'task.ratio' in app,'native still crop/mirror metadata missing')
          need('profile.jpeg' in app.split('async function processContinuousPhoto',1)[1].split('async function runPhotoProcessQueue',1)[0],'continuous-save JPEG tier missing')

          # Quality bottlenecks removed/improved.
          need('const maxSide=1920' not in app.split('async function processContinuousPhoto',1)[1].split('async function runPhotoProcessQueue',1)[0],'old 1920 continuous cap remains')
          need('const max=state.exportQuality===\'Original\'?4096:state.exportQuality===\'High\'?3072:1440' in app,'High Develop export not raised to 3072')
          need("state.exportQuality==='Original'?.97" in app and 'Math.max(.96,quality)' in app,'high-quality manual JPEG export missing')

          # No extra camera stream was introduced.
          need(app.count('getUserMedia(constraints)')==1,'video camera stream count changed')
          need(app.count('getUserMedia({audio:')==1,'optional audio-only stream count changed')

          # Preserve filter library + earlier critical fixes.
          block=app.split('const builtins=[',1)[1].split('].map(([name,cat,c,p])',1)[0]
          names=re.findall(r"\['([^']+)'\s*,\s*'([^']+)'",block)
          need(len(names)==233,f'expected 233 filters, got {len(names)}')
          need(len({n for n,c in names})==233,'duplicate filter names')
          need(sum(1 for n,c in names if c=='Mono')==10,'Mono collection changed')
          need('function applyFinalMono' in app and 'putImageData' in app.split('function applyFinalMono',1)[1].split('function applyPresetCast',1)[0],'deterministic Mono regressed')
          need("filterIntensity:50" in app,'50% filter default regressed')
          need(".live-beauty-canvas{display:none!important;opacity:0!important}" in css,'capture-safe Beauty regressed')
          need('applyBeautyPass(ctx,w,h,state.beauty)' in app,'captured Beauty missing')
          need('cameraFlashBtn' in idx and 'prepareCaptureFlash' in app,'Flash regressed')
          need('bulkDeleteSelectedBtn' in idx and 'function deleteSelectedBulk' in app,'bulk delete regressed')
          need('photoMediaSwipeZone' in idx and 'function navigatePhotoModal' in app,'Media Details browsing regressed')

          # PWA/mobile basics.
          ids=re.findall(r'\bid="([^"]+)"',idx)
          dup=[x for x in set(ids) if ids.count(x)>1]
          need(not dup,f'duplicate DOM ids: {dup}')
          need('maximum-scale=1' in idx and 'user-scalable=no' in idx,'zoom prevention viewport missing')
          need('function preventZoom' in app,'programmatic zoom prevention missing')
          need('assets/fonts1989/manifest.json' in sw,'1989 Sparkle shell asset missing')
          need('kira.livePhoto' in app and 'motionBlob' in app,'retired Kira Live cleanup missing')
          print('QA PASS: high-quality still capture, 233 filters, critical regressions, PWA parity')
          PY
          git diff --check
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js sw.js
          git commit -m "Kira v1.0: improve still photo quality"
          git push origin main
