name: Kira filter engine release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira-filter-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch filter engine and reference looks
        run: python .github/kira_filter_patch.py

      - name: QA release files
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python .github/kira_filter_qa.py
          git diff --check

      - name: Commit production update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Kira 11.7: recalibrate filters and add Mood looks"
          git push origin HEAD:main
