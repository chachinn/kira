name: Kira v1.0 high-quality still capture rerun

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply corrected production patch
        run: python .github/scripts/kira_v1_high_quality_still_run.py
      - name: QA high-quality still capture and critical regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          cmp -s service-worker.js sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text(); idx=Path('index.html').read_text(); css=Path('style.css').read_text(); sw=Path('service-worker.js').read_text()
          def need(x,msg):
              if not x: raise SystemExit(msg)
          need('v1.0' in idx,'public v1.0 label missing')
          for s in ['manifest.json?v=1.0.8','style.css?v=1.0.8','app.js?v=1.0.8']: need(s in idx,f'missing {s}')
          need("service-worker.js?v=1.0.8" in app,'SW registration mismatch')
          need("kira-v1-0-high-quality-still-20260817" in sw,'cache key missing')
          need("photoQuality:'high'" in app,'High photo-quality default missing')
          need('id="settingPhotoQuality"' in idx,'photo-quality UI missing')
          for v in ['standard','high','max']: need(f'value="{v}"' in idx,f'photo-quality option {v} missing')
          need("maxSide:2048" in app and "maxSide:3072" in app and "maxSide:3840" in app,'photo resolution tiers missing')
          need("jpeg:.93" in app and "jpeg:.96" in app and "jpeg:.97" in app,'JPEG tiers missing')
          need("typeof ImageCapture==='function'" in app,'ImageCapture feature detection missing')
          need('new ImageCapture(track)' in app and '.takePhoto()' in app,'true still-photo path missing')
          need('function captureBestStill' in app and 'function cropCameraSourceToRatio' in app and 'function prepareStillForDevelop' in app,'still helpers incomplete')
          need('captureCanvasForRatio(video,profile.maxSide)' in app,'video-frame fallback missing')
          need("photoQuality:state.settings.photoQuality||'high'" in app,'queued quality snapshot missing')
          proc=app.split('async function processContinuousPhoto',1)[1].split('async function runPhotoProcessQueue',1)[0]
          need('const maxSide=1920' not in proc,'old 1920 continuous cap remains')
          need('task.needsCrop' in proc and "task.facing==='user'" in proc and 'task.ratio' in proc,'native still crop metadata missing')
          need('profile.jpeg' in proc,'continuous JPEG tier missing')
          need("max=state.exportQuality==='Original'?4096:state.exportQuality==='High'?3072:1440" in app,'High Develop export not 3072')
          need("state.exportQuality==='Original'?.97" in app and 'Math.max(.96,quality)' in app,'manual JPEG export quality missing')
          need(app.count('getUserMedia(constraints)')==1,'video camera stream count changed')
          need(app.count('getUserMedia({audio:')==1,'optional audio stream count changed')
          block=app.split('const builtins=[',1)[1].split('].map(([name,cat,c,p])',1)[0]
          names=re.findall(r"\['([^']+)'\s*,\s*'([^']+)'",block)
          need(len(names)==233,f'expected 233 filters, got {len(names)}')
          need(len({n for n,c in names})==233,'duplicate filter names')
          need(sum(1 for n,c in names if c=='Mono')==10,'Mono collection changed')
          mono=app.split('function applyFinalMono',1)[1].split('function applyPresetCast',1)[0]
          need('putImageData' in mono,'deterministic Mono regressed')
          need("filterIntensity:50" in app,'50% filter default regressed')
          need(".live-beauty-canvas{display:none!important;opacity:0!important}" in css,'capture-safe Beauty regressed')
          need('applyBeautyPass(ctx,w,h,state.beauty)' in app,'captured Beauty missing')
          need('cameraFlashBtn' in idx and 'prepareCaptureFlash' in app,'Flash regressed')
          need('bulkDeleteSelectedBtn' in idx and 'function deleteSelectedBulk' in app,'bulk delete regressed')
          need('photoMediaSwipeZone' in idx and 'function navigatePhotoModal' in app,'Media Details browse regressed')
          ids=re.findall(r'\bid="([^"]+)"',idx); dup=[x for x in set(ids) if ids.count(x)>1]
          need(not dup,f'duplicate DOM ids: {dup}')
          need('maximum-scale=1' in idx and 'user-scalable=no' in idx,'zoom viewport missing')
          need('function preventZoom' in app,'programmatic zoom prevention missing')
          need('assets/fonts1989/manifest.json' in sw,'1989 Sparkle asset missing')
          need('kira.livePhoto' in app and 'motionBlob' in app,'retired Kira Live cleanup missing')
          print('QA PASS: true still capture, high-resolution tiers, 233 filters, critical regressions')
          PY
          git diff --check
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js sw.js
          git commit -m "Kira v1.0: improve still photo quality"
          git push origin main
