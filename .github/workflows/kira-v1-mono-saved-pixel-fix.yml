name: Kira v1.0 Mono saved-photo pixel fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply production patch
        run: python .github/scripts/kira_v1_mono_saved_pixel_fix.py
      - name: QA Mono saved-photo path and critical regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          cmp -s service-worker.js sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text()
          idx=Path('index.html').read_text()
          sw=Path('service-worker.js').read_text()
          def need(x,msg):
              if not x: raise SystemExit(msg)

          # Library integrity.
          block=app.split('const builtins=[',1)[1].split('].map(([name,cat,c,p])',1)[0]
          pairs=re.findall(r"\['([^']+)'\s*,\s*'([^']+)'",block)
          need(len(pairs)==233,f'expected 233 built-ins, got {len(pairs)}')
          need(len({n for n,_ in pairs})==233,'duplicate filter names')
          need(len([1 for _,c in pairs if c=='Mono'])==10,'expected 10 Mono filters')

          # iPhone-safe Mono implementation: no CanvasFilter/self-copy dependency for saved stills.
          mono=app.split('function applyFinalMono',1)[1].split('function applyPresetCast',1)[0]
          need('getImageData(0,0,w,h)' in mono,'Mono pixel read missing')
          need('putImageData(im,0,0)' in mono,'Mono pixel write missing')
          need('.2126*d[i]+.7152*d[i+1]+.0722*d[i+2]' in mono,'Rec.709 luminance conversion missing')
          need('d[i]=y;d[i+1]=y;d[i+2]=y' in mono,'RGB grayscale write missing')
          need("filter='grayscale(100%)'" not in mono,'saved Mono still relies on Canvas filter')
          need('drawImage(canvas' not in mono,'saved Mono still self-copies canvas')
          need(app.count('if(p.mono)applyFinalMono(ctx,canvas,w,h)')>=2,'Mono final pass missing from Develop/capture')
          need("mono:monoLookActive(f,state.filterIntensity)" in app,'live/current Mono flag missing')
          need("mono:monoLookActive(f,s.filterIntensity??100)" in app,'snapshot Mono flag missing')
          need('grayscale(100%)' in app.split('function cameraCssFromParams',1)[1].split('function liveParamsForPreset',1)[0],'live Mono grayscale missing')

          # Deterministic algorithm sanity on representative RGB samples.
          samples=[(255,0,0),(0,255,0),(0,0,255),(92,154,211),(240,191,133),(20,20,20)]
          for r,g,b in samples:
              y=round(.2126*r+.7152*g+.0722*b)
              out=(y,y,y)
              need(out[0]==out[1]==out[2],f'grayscale invariant failed for {(r,g,b)}')
              need(0<=y<=255,'luma out of range')

          # Preserve preview/capture core parity and current features.
          need('function applyPreviewToneToCanvas' in app,'shared preview/capture tone helper missing')
          need('applyPreviewToneToCanvas(ctx,w,h,p)' in app,'captured still parity helper missing')
          need('filterIntensity:50' in app,'50% filter default regressed')
          need('function modalBrowseItems' in app and 'photoBrowseCount' in idx,'Media Details browsing regressed')
          need('function deleteSelectedBulk' in app,'bulk delete regressed')
          need('prepareCaptureFlash' in app,'Flash regressed')
          need(".live-beauty-canvas{display:none!important;opacity:0!important}" in Path('style.css').read_text(),'capture-safe Beauty regressed')
          need(app.count('getUserMedia(constraints)')==1,'camera stream call count changed')
          need(app.count('getUserMedia({audio:')==1,'optional audio stream call count changed')

          # PWA update coherence.
          for s in ['manifest.json?v=1.0.7','style.css?v=1.0.7','app.js?v=1.0.7']:
              need(s in idx,f'missing {s}')
          need('service-worker.js?v=1.0.7' in app,'SW registration version mismatch')
          need('kira-v1-0-mono-pixel-save-fix-20260815' in sw,'cache bump missing')
          need('maximum-scale=1' in idx and 'user-scalable=no' in idx,'viewport zoom guard missing')
          need('assets/fonts1989/manifest.json' in sw,'1989 Sparkle shell asset missing')
          print('QA PASS: deterministic saved Mono pixels + 233 filters + parity/features/PWA regressions')
          PY
          git diff --check
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js sw.js
          git commit -m "Kira v1.0: make saved Mono deterministic on iPhone"
          git push origin main
