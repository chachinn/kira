name: Kira 12.4 filter cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira124-filter-cleanup.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baseline filter audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('app.js','utf8');
          function readBuiltins(src){
            const prefix='const builtins=';
            const start=src.indexOf(prefix);
            const end=src.indexOf('  ].map(([name,cat,c,p])=>',start);
            if(start<0||end<0)throw new Error('Could not locate built-in filter array');
            const literal=src.slice(start+prefix.length,end+3);
            return Function('"use strict"; return ('+literal+');')();
          }
          function counts(rows){const out={};for(const r of rows)out[r[1]]=(out[r[1]]||0)+1;return out}
          function canonical(v){
            if(Array.isArray(v))return v.map(canonical);
            if(v&&typeof v==='object')return Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])]));
            return v;
          }
          const rows=readBuiltins(text);
          const names=rows.map(r=>r[0]);
          const dup=names.filter((n,i)=>names.indexOf(n)!==i);
          if(dup.length)throw new Error('Duplicate filter names: '+[...new Set(dup)].join(', '));
          const signatureMap=new Map();
          for(const r of rows){
            const sig=JSON.stringify([r[2],canonical(r[3])]);
            const list=signatureMap.get(sig)||[];list.push(r[0]);signatureMap.set(sig,list);
          }
          const exact=[...signatureMap.values()].filter(x=>x.length>1);
          console.log('Built-in filters:',rows.length);
          console.log('Category counts before:',JSON.stringify(counts(rows)));
          console.log('Exact visual-definition duplicates:',exact.length?JSON.stringify(exact):'none');
          fs.writeFileSync('/tmp/kira-before.json',JSON.stringify({names,total:rows.length,categories:counts(rows),exact},null,2));
          NODE

      - name: Apply Kira 12.4 taxonomy cleanup
        run: python .github/kira124_filter_cleanup.py

      - name: JavaScript syntax
        run: node --check app.js

      - name: Filter taxonomy regression
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('app.js','utf8');
          const before=JSON.parse(fs.readFileSync('/tmp/kira-before.json','utf8'));
          function readBuiltins(src){
            const prefix='const builtins=';
            const start=src.indexOf(prefix);
            const end=src.indexOf('  ].map(([name,cat,c,p])=>',start);
            if(start<0||end<0)throw new Error('Could not locate built-in filter array');
            const literal=src.slice(start+prefix.length,end+3);
            return Function('"use strict"; return ('+literal+');')();
          }
          function counts(rows){const out={};for(const r of rows)out[r[1]]=(out[r[1]]||0)+1;return out}
          const rows=readBuiltins(text),names=rows.map(r=>r[0]),afterCounts=counts(rows);
          if(rows.length!==before.total)throw new Error(`Filter count changed: ${before.total} -> ${rows.length}`);
          if(JSON.stringify(names)!==JSON.stringify(before.names))throw new Error('Filter names/order changed; taxonomy cleanup must not rename or delete filters');
          const dup=names.filter((n,i)=>names.indexOf(n)!==i);
          if(dup.length)throw new Error('Duplicate filter names after cleanup: '+[...new Set(dup)].join(', '));
          const expected={
            'Kira':7,'Beauty':19,'Film':28,'Instant':25,'Vintage':34,'CCD':7,'Date Cam':24,
            'Y2K':6,'Dream':6,'Japan':8,'Lo-Fi':16,'Recolor':17,'Mono':10,'Flash Night':10,'Camera Packs':16
          };
          if(JSON.stringify(Object.keys(afterCounts).sort())!==JSON.stringify(Object.keys(expected).sort()))throw new Error('Unexpected built-in categories: '+JSON.stringify(afterCounts));
          for(const [cat,count] of Object.entries(expected))if(afterCounts[cat]!==count)throw new Error(`${cat}: expected ${count}, got ${afterCounts[cat]}`);
          if(afterCounts['Mood']||afterCounts['Film Stock'])throw new Error('Removed redundant categories still contain filters');
          const expectedUI=['Kira','Beauty','Film','Instant','Vintage','CCD','Date Cam','Y2K','Dream','Japan','Lo-Fi','Recolor','Mono','Flash Night','Camera Packs','Recent','Favorites','My Recipes','All'];
          const matches=[...text.matchAll(/const cats=\[([^\]]+)\];/g)].map(m=>Function('return ['+m[1]+']')());
          if(matches.length!==2)throw new Error(`Expected 2 filter category UI lists, found ${matches.length}`);
          for(const list of matches)if(JSON.stringify(list)!==JSON.stringify(expectedUI))throw new Error('Camera/Develop category order diverged: '+JSON.stringify(list));
          const mapped={
            'Violet Hour':'Recolor','Amber Memory':'Vintage','Midnight Blue':'Flash Night','Rose Noir':'Flash Night','Silver Soft':'Mono','Deep Mono':'Mono'
          };
          for(const [name,cat] of Object.entries(mapped)){
            const row=rows.find(r=>r[0]===name);
            if(!row||row[1]!==cat)throw new Error(`${name} was not moved to ${cat}`);
          }
          console.log('Category counts after:',JSON.stringify(afterCounts));
          console.log('All 233 filters preserved; Mood removed; Film Stock merged into Film.');
          NODE

      - name: Production regression audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, struct
          from pathlib import Path

          required=[
              'index.html','style.css','app.js','manifest.json','service-worker.js','sw.js',
              'icons/icon-32.png','icons/icon-48.png','icons/icon-72.png','icons/icon-96.png',
              'icons/icon-128.png','icons/icon-144.png','icons/icon-152.png','icons/icon-180.png',
              'icons/icon-192.png','icons/icon-384.png','icons/icon-512.png',
              'icons/icon-192-maskable.png','icons/icon-512-maskable.png','assets/fonts1989/manifest.json'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, f'Missing production files: {missing}'

          index=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert sw==Path('sw.js').read_text(encoding='utf-8'), 'service workers diverged'
          assert './app.js?v=12.4.0' in index and './style.css?v=12.4.0' in index
          assert 'BUILD 12.4' in index and '<b>Build 12.4</b>' in index
          assert 'kira-build12-4-filter-cleanup-20260815' in sw
          assert "service-worker.js?v=12.4.0" in app
          assert 'maximum-scale=1' in index and 'user-scalable=no' in index
          assert 'An update is available. Refresh to update.' in index

          ids=re.findall(r'\bid="([^"]+)"',index)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'Duplicate DOM ids: {dup}'

          critical=[
              'startCamera','stopCamera','bootCameraSafely','captureLivePhoto','startVideoRecording','stopVideoRecording',
              'renderRolls','openPhotoModal','safeOpenPhotoModal','storeRollPhoto','refreshRolls','renderPhoto',
              'applyBeautyPass','buildBeautyLayer','detectBeautyFaceBox','renderLiveBeautyFrame','stopLiveBeautyPreview',
              'setCameraControlsOpen','toggleCameraImmersive','cleanupRetiredMotionPairs','draw1989Text','drawCaptionText',
              'renderInstantCaptionBlob','shareQueuedPhotos','saveAllCurrent','preventZoom'
          ]
          for fn in critical:
              assert re.search(rf'function\s+{re.escape(fn)}\s*\(',app), f'Missing critical function: {fn}'

          # Camera / Beauty architecture: one live face layer, one video-camera stream.
          live_match=re.search(r'function\s+applyLiveFilter\s*\(\)\{(.*?)\n\s*function\s+updateCameraViewport',app,re.S)
          assert live_match, 'applyLiveFilter block missing'
          live=live_match.group(1)
          assert 'beautyBlur' not in live, 'whole-frame Beauty blur returned'
          assert 'video.style.filter=cameraCssFromParams(p)' in live
          assert 'scheduleLiveBeautyPreview(0)' in live
          assert index.count('id="liveBeautyCanvas"')==1, 'live Beauty canvas count changed'
          assert '.live-beauty-canvas' in css
          assert 'const LIVE_BEAUTY_INTERVAL=145' in app
          assert 'longSide=260' in app and "buildBeautyLayer(source,liveBeauty,280,'live')" in app
          assert 'if(state.recording||document.hidden' in app
          assert app.count('navigator.mediaDevices.getUserMedia(constraints)')==1, 'unexpected extra video camera stream path'

          for token in (
              'detectBeautyFaceBox','beautyFaceWeight','featureKeep',
              'acneMix=clamp(bl*mask','rr+=(hr-rr)*acneMix',
              "buildBeautyLayer(ctx.canvas,beauty,920,'still')"
          ):
              assert token in app, f'Missing face Beauty token: {token}'

          # Camera controls / immersive camera must remain escapable.
          assert 'id="cameraControlsCloseBtn"' in index and 'id="cameraControlsDoneBtn"' in index
          assert '.camera-controls-close-btn' in css and 'max-height:min(58dvh,640px)' in css
          assert 'id="cameraImmersiveBtn"' in index and 'function toggleCameraImmersive' in app
          assert 'if(on)setCameraControlsOpen(false)' in app

          # Retired Kira Live must stay retired. Migration-only cleanup fields are allowed.
          forbidden=['livePhotoBtn','photoLivePlayBtn','captureKiraLivePhoto','captureLiveMotionClip','toggleLivePhoto','livePhotoEnabled','liveCaptureBusy','live-roll-badge','Play Live']
          for token in forbidden:
              assert token not in app+index+css, f'Retired Live residue: {token}'

          # First install remains clean: no seeded user Rolls, recipes, or media.
          assert "localStorage.getItem('kira.recipes')||'[]'" in app
          assert "localStorage.getItem('kira.namedRolls')||'[]'" in app
          assert 'rolls:[]' in app

          # Custom 1989 Sparkle alphabet/digits regression.
          glyph=json.loads(Path('assets/fonts1989/manifest.json').read_text(encoding='utf-8'))
          chars=set(glyph.keys()) if isinstance(glyph,dict) else set()
          expected_chars=set('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz')
          assert expected_chars.issubset(chars), f'1989 glyph manifest missing: {sorted(expected_chars-chars)}'
          for sample in ('1989','0123456789','ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'):
              assert all(ch in chars for ch in sample), f'1989 sample failed: {sample}'
          for digit,file_no in zip('0123456789',range(48,58)):
              token=f'"{digit}":{{"file":"{file_no}.png"'
              assert token in app, f'1989 digit mapping wrong for {digit}'
          for file_no in list(range(48,58))+list(range(65,91))+list(range(97,123)):
              assert Path(f'assets/fonts1989/{file_no}.png').is_file(), f'Missing 1989 glyph file {file_no}.png'

          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          required_manifest_sizes={'72x72','96x96','128x128','144x144','152x152','180x180','192x192','384x384','512x512'}
          sizes={i.get('sizes') for i in manifest.get('icons',[]) if i.get('purpose')=='any'}
          assert required_manifest_sizes.issubset(sizes), f'Manifest icon sizes missing: {required_manifest_sizes-sizes}'
          for icon in manifest.get('icons',[]):
              src=icon.get('src','').lstrip('./')
              assert Path(src).is_file(), f'Manifest icon missing: {src}'

          def png_size(path):
              data=Path(path).read_bytes()[:24]
              assert data[:8]==b'\x89PNG\r\n\x1a\n', f'Not PNG: {path}'
              return struct.unpack('>II',data[16:24])
          for size in (32,48,72,96,128,144,152,180,192,384,512):
              p=f'icons/icon-{size}.png'
              assert png_size(p)==(size,size), f'Wrong dimensions: {p}'
          assert png_size('icons/icon-192-maskable.png')==(192,192)
          assert png_size('icons/icon-512-maskable.png')==(512,512)

          # Repository hygiene: temporary release files are the only non-production additions allowed during this run.
          forbidden_suffixes={'.zip','.bak','.orig','.rej','.tmp','.log'}
          junk=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              low=p.name.lower()
              if p.suffix.lower() in forbidden_suffixes or low=='.ds_store' or 'screenshot' in low:
                  junk.append(str(p))
          assert not junk, f'Repository junk detected: {junk}'
          print('Kira 12.4 production regression audit passed.')
          PY

      - name: PWA local HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m http.server 8765 >/tmp/kira-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/index.html -o /tmp/kira-index.html
          curl -fsS http://127.0.0.1:8765/app.js -o /tmp/kira-app.js
          curl -fsS http://127.0.0.1:8765/style.css -o /tmp/kira-style.css
          curl -fsS http://127.0.0.1:8765/service-worker.js -o /tmp/kira-sw.js
          grep -q 'BUILD 12.4' /tmp/kira-index.html
          grep -q 'Film Stock has been folded into Film' /tmp/kira-index.html
          grep -q "'Film':28" /dev/null 2>/dev/null || true
          grep -q 'liveBeautyCanvas' /tmp/kira-index.html
          grep -q 'detectBeautyFaceBox' /tmp/kira-app.js
          grep -q 'LIVE_BEAUTY_INTERVAL=145' /tmp/kira-app.js
          ! grep -q "'Mood'" /tmp/kira-app.js
          ! grep -q "'Film Stock'" /tmp/kira-app.js
          grep -q 'kira-build12-4-filter-cleanup-20260815' /tmp/kira-sw.js

      - name: Commit Kira 12.4 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Kira 12.4: clean and recategorize filter library"
          git push origin HEAD:main
