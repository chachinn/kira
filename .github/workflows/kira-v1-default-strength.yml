name: Kira v1.0 default filter strength

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira-v1-default-strength.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set default strength to 50
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          app=Path('app.js').read_text(encoding='utf-8')
          old="activeFilter:'Old Rose',activeCategory:'Kira',filterIntensity:100,filterSearch:''"
          new="activeFilter:'Old Rose',activeCategory:'Kira',filterIntensity:50,filterSearch:''"
          assert app.count(old)==1, f'unexpected app default match count: {app.count(old)}'
          app=app.replace(old,new)
          app=app.replace("navigator.serviceWorker.register('./service-worker.js?v=1.0.0')","navigator.serviceWorker.register('./service-worker.js?v=1.0.1')")
          Path('app.js').write_text(app,encoding='utf-8')

          index=Path('index.html').read_text(encoding='utf-8')
          replacements={
            '<link rel="manifest" href="./manifest.json?v=1.0.0" />':'<link rel="manifest" href="./manifest.json?v=1.0.1" />',
            '<link rel="stylesheet" href="./style.css?v=1.0.0" />':'<link rel="stylesheet" href="./style.css?v=1.0.1" />',
            '<script src="./app.js?v=1.0.0"></script>':'<script src="./app.js?v=1.0.1"></script>',
            '<div class="control-head"><span>Filter strength</span><b id="liveIntensityValue">100</b></div>':'<div class="control-head"><span>Filter strength</span><b id="liveIntensityValue">50</b></div>',
            '<input id="liveFilterIntensity" type="range" min="0" max="100" value="100">':'<input id="liveFilterIntensity" type="range" min="0" max="100" value="50">',
            '<span id="activeLookIntensity">100%</span>':'<span id="activeLookIntensity">50%</span>',
            '<div class="control-head"><span>Strength</span><b id="intensityValue">100</b></div>':'<div class="control-head"><span>Strength</span><b id="intensityValue">50</b></div>',
            '<input type="range" id="filterIntensity" min="0" max="100" value="100" />':'<input type="range" id="filterIntensity" min="0" max="100" value="50" />',
            'The 0–100 strength slider still works normally: 0 stays neutral, lower values stay softer, and 100 now shows the full intended character of the selected look.':'The 0–100 strength slider still works normally: Kira starts at a balanced 50%, 0 stays neutral, and 100 shows the full intended character of the selected look.'
          }
          for old,new in replacements.items():
            assert index.count(old)==1, f'unexpected index match count for {old[:40]!r}: {index.count(old)}'
            index=index.replace(old,new)
          Path('index.html').write_text(index,encoding='utf-8')

          for name in ('service-worker.js','sw.js'):
            p=Path(name)
            text=p.read_text(encoding='utf-8')
            old="const CACHE='kira-v1-0-strong-filter-identity-20260815';"
            new="const CACHE='kira-v1-0-default-strength-50-20260815';"
            assert text.count(old)==1, f'{name}: unexpected cache key count {text.count(old)}'
            p.write_text(text.replace(old,new),encoding='utf-8')
          PY

      - name: QA
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          python - <<'PY'
          from pathlib import Path
          app=Path('app.js').read_text(encoding='utf-8')
          index=Path('index.html').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert "filterIntensity:50" in app
          assert "filterIntensity:100" not in app.split('const state={',1)[1].split('};',1)[0]
          assert 'id="liveIntensityValue">50<' in index
          assert 'id="liveFilterIntensity" type="range" min="0" max="100" value="50"' in index
          assert 'id="activeLookIntensity">50%</span>' in index
          assert 'id="intensityValue">50<' in index
          assert 'id="filterIntensity" min="0" max="100" value="50"' in index
          assert '<b>v1.0</b>' in index
          assert '<div class="release-badge">v1.0</div>' in index
          assert './app.js?v=1.0.1' in index
          assert "service-worker.js?v=1.0.1" in app
          assert sw==Path('sw.js').read_text(encoding='utf-8')
          assert 'kira-v1-0-default-strength-50-20260815' in sw
          assert 'FILTER_IDENTITY_GAIN' in app and 'presetIdentityGain' in app
          print('Kira v1.0 default strength 50 QA passed.')
          PY
          git diff --check

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js sw.js
          git commit -m "Kira v1.0: default filter strength to 50"
          git push origin HEAD:main
