name: Kira 12.2 camera controls and beauty

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira122-camera-beauty.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kira 12.2 patch
        run: python .github/kira122_camera_beauty_fix.py

      - name: JavaScript syntax
        run: node --check app.js

      - name: Production regression audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, struct
          from pathlib import Path

          required=[
              'index.html','style.css','app.js','manifest.json','service-worker.js','sw.js',
              'icons/icon-32.png','icons/icon-48.png','icons/icon-72.png','icons/icon-96.png',
              'icons/icon-128.png','icons/icon-144.png','icons/icon-152.png','icons/icon-180.png',
              'icons/icon-192.png','icons/icon-384.png','icons/icon-512.png',
              'icons/icon-192-maskable.png','icons/icon-512-maskable.png','assets/fonts1989/manifest.json'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, f'Missing production files: {missing}'

          index=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert sw==Path('sw.js').read_text(encoding='utf-8'), 'service workers diverged'
          assert './app.js?v=12.2.0' in index and './style.css?v=12.2.0' in index
          assert 'BUILD 12.2' in index
          assert 'kira-build12-2-beauty-controls-20260814' in sw
          assert 'service-worker.js?v=12.2.0' in app
          assert 'maximum-scale=1' in index and 'user-scalable=no' in index

          ids=re.findall(r'\bid="([^"]+)"',index)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'Duplicate DOM ids: {dup}'

          critical=[
              'startCamera','stopCamera','captureLivePhoto','startVideoRecording','stopVideoRecording',
              'renderRolls','openPhotoModal','safeOpenPhotoModal','applyBeautyPass','setCameraControlsOpen',
              'toggleCameraImmersive','cleanupRetiredMotionPairs','draw1989Text','renderInstantCaptionBlob',
              'shareQueuedPhotos','saveAllCurrent','preventZoom'
          ]
          for fn in critical:
              assert re.search(rf'function\s+{re.escape(fn)}\s*\(',app), f'Missing critical function: {fn}'

          # Camera controls sheet must always have close affordances and bounded scrolling.
          assert 'id="cameraControlsCloseBtn"' in index
          assert 'id="cameraControlsDoneBtn"' in index
          assert "setCameraControlsOpen(false,true)" in app
          assert 'max-height:min(58dvh,640px)' in css
          assert 'overflow-y:auto' in css
          assert 'position:sticky' in css and '.camera-controls-close-btn' in css

          # Beauty must be materially stronger than Build 12.1 while remaining selective/off-main-loop.
          expected_tokens=[
              '*2.05','target=Math.min(maxSide,920)',
              'Math.min(14,radius)',
              'const blemishTarget=clamp((detail-1)/18+redExcess/34+darkSpot*1.15,0,1)',
              'sm*.82+bl*.22+bl*1.08*blemishTarget',
              'rr-=excess*bl*blemishTarget*.52',
              'blemishTarget*.46',
              'skin*1.16*(sm*.76+bl*(.24+.98*blemishTarget)',
              'beautyBlur=Math.min(1.65'
          ]
          for token in expected_tokens:
              assert token in app, f'Missing stronger beauty token: {token}'
          assert app.count('navigator.mediaDevices.getUserMedia(constraints)')==1, 'unexpected extra camera stream path'
          assert 'requestAnimationFrame(()=>{liveFilterFrame=0;applyLiveFilter()})' in app, 'live filter throttling missing'

          # Retired Kira Live must stay gone.
          forbidden=['livePhotoBtn','photoLivePlayBtn','captureKiraLivePhoto','captureLiveMotionClip','toggleLivePhoto','livePhotoEnabled','liveCaptureBusy','live-roll-badge','Play Live']
          for token in forbidden:
              assert token not in app+index+css, f'Retired Live residue: {token}'

          glyph=json.loads(Path('assets/fonts1989/manifest.json').read_text(encoding='utf-8'))
          chars=set(glyph.keys()) if isinstance(glyph,dict) else set()
          expected=set('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz')
          assert expected.issubset(chars), f'1989 glyph manifest missing: {sorted(expected-chars)}'
          for sample in ('1989','0123456789','ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'):
              assert all(ch in chars for ch in sample), f'1989 sample failed: {sample}'

          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          for icon in manifest.get('icons',[]):
              src=icon.get('src','').lstrip('./')
              assert Path(src).is_file(), f'Manifest icon missing: {src}'

          def png_size(path):
              data=Path(path).read_bytes()[:24]
              assert data[:8]==b'\x89PNG\r\n\x1a\n', f'Not PNG: {path}'
              return struct.unpack('>II',data[16:24])
          for size in (32,48,72,96,128,144,152,180,192,384,512):
              p=f'icons/icon-{size}.png'
              assert png_size(p)==(size,size), f'Wrong dimensions: {p}'
          assert png_size('icons/icon-192-maskable.png')==(192,192)
          assert png_size('icons/icon-512-maskable.png')==(512,512)
          print('Kira 12.2 camera/beauty regression audit passed.')
          PY

      - name: PWA local HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m http.server 8765 >/tmp/kira-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/index.html -o /tmp/kira-index.html
          curl -fsS http://127.0.0.1:8765/app.js -o /tmp/kira-app.js
          curl -fsS http://127.0.0.1:8765/style.css -o /tmp/kira-style.css
          curl -fsS http://127.0.0.1:8765/service-worker.js -o /tmp/kira-sw.js
          grep -q 'BUILD 12.2' /tmp/kira-index.html
          grep -q 'cameraControlsCloseBtn' /tmp/kira-index.html
          grep -q 'setCameraControlsOpen' /tmp/kira-app.js
          grep -q 'beautyBlur=Math.min(1.65' /tmp/kira-app.js
          grep -q 'max-height:min(58dvh,640px)' /tmp/kira-style.css
          grep -q 'kira-build12-2-beauty-controls-20260814' /tmp/kira-sw.js

      - name: Commit Kira 12.2 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Kira 12.2: fix camera controls and strengthen beauty"
          git push origin HEAD:main
