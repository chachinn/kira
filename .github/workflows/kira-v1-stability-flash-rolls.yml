name: Kira v1.0 Beauty stability flash Rolls delete

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch v1.0 stability features
        run: |
          echo ' e3RvcmNoOnRydWV9XX0pO3N0YXRlLmNhbWVyYVRvcmNoT249dHJ1ZX1hd2FpdCBuZXcgUHJvbWlzZShyPT5zZXRUaW1lb3V0KHIsMTIwKSk7cmV0dXJuIGFzeW5jKCk9PntpZighd2FzT24pe2F3YWl0IG5ldyBQcm9taXNlKHI9PnNldFRpbWVvdXQociwzNSkpO3RyeXthd2FpdCB0cmFjay5hcHBseUNvbnN0cmFpbnRzKHthZHZhbmNlZDpb ' | base64 -d > /tmp/kira_patch.py
          python3 /tmp/kira_patch.py

      - name: QA v1.0 regression suite
        run: |
          set -euo pipefail
          node --check app.js
          cmp -s service-worker.js sw.js
          git diff --check
          grep -q "LIVE_BEAUTY_INTERVAL=120" app.js
          grep -q "stabilizeLiveBeautyFace" app.js
          grep -q "bucket==='live'?stabilizeLiveBeautyFace" app.js
          grep -q "resetLiveBeautyTracking" app.js
          grep -q "if(!face)return null" app.js
          ! grep -q "detectBeautyFaceBox(od,tw,th)||{cx:tw\\*.5" app.js
          test "$(grep -o "state.cameraFacing!=='user'" app.js | wc -l)" -ge 2
          grep -q "cameraFlashMode" app.js
          grep -q "prepareCaptureFlash" app.js
          grep -q "cameraFlashBtn" index.html
          grep -q "camera-screen-flash" style.css
          grep -q "bulkDeleteSelectedBtn" index.html
          grep -q "deleteSelectedBulk" app.js
          grep -q "filterIntensity:50" app.js
          grep -q "service-worker.js?v=1.0.4" app.js
          grep -q "app.js?v=1.0.4" index.html
          grep -q "style.css?v=1.0.4" index.html
          grep -q "Current version</span><b>v1.0</b>" index.html
          ! grep -q "Kira Live" index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          a=Path('app.js').read_text()
          h=Path('index.html').read_text()
          css=Path('style.css').read_text()
          ids=re.findall(r'\\bid="([^"]+)"',h)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert a.count('navigator.mediaDevices.getUserMedia(constraints)')==1
          assert a.count('navigator.mediaDevices.getUserMedia({audio:')==1
          assert 'liveBeautyFaceMisses<=1' in a
          assert "move>.12?.62:.34" in a
          assert "state.cameraFacing==='user'" in a and 'cameraScreenFlash' in a
          assert "state.cameraCapabilities?.torch" in a and 'torch:true' in a and 'torch:false' in a
          assert 'await prepareCaptureFlash()' in a and 'await releaseFlash()' in a
          assert 'confirm(`Delete ${n} selected item' in a
          assert 'state.photosQueueIds=state.photosQueueIds.filter' in a
          assert '.tiny-btn.danger' in css
          assert "mask*(.30+.62*effectPeak)" in a
          print('Kira v1.0 combined regression invariants passed')
          PY

      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js sw.js
          git commit -m "Kira v1.0: stabilize Beauty, add capture flash and bulk delete"
          git push origin main
