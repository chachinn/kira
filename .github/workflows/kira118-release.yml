name: Kira 11.8 filter expansion release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira118-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production patch and static QA
        run: python .github/kira118_release.py

      - name: JavaScript and repository QA
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          test -f index.html
          test -f style.css
          test -f manifest.json
          test -f service-worker.js
          test -f sw.js
          test -f icons/icon-32.png
          test -f icons/icon-96.png
          test -f icons/icon-180.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-192-maskable.png
          test -f icons/icon-512-maskable.png
          test -f assets/fonts1989/manifest.json
          cmp service-worker.js sw.js
          git diff --check
          python -m http.server 8765 >/tmp/kira-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/index.html | grep -q 'BUILD 11.8'
          curl -fsS http://127.0.0.1:8765/app.js | grep -q 'Toy Cam 1998'
          curl -fsS http://127.0.0.1:8765/service-worker.js | grep -q 'kira-build11-8-mega-filter-library-20260814'

      - name: Commit Kira 11.8 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html service-worker.js sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Kira 11.8: add 48 lo-fi, recolor, mono and night filters"
          git push origin HEAD:main
