name: Kira 12.3 face beauty

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kira123-face-beauty.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Kira 12.3 production patch
        run: python .github/kira123_face_beauty_fix.py

      - name: JavaScript syntax
        run: node --check app.js

      - name: Production regression audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re, struct
          from pathlib import Path

          required=[
              'index.html','style.css','app.js','manifest.json','service-worker.js','sw.js',
              'icons/icon-32.png','icons/icon-48.png','icons/icon-72.png','icons/icon-96.png',
              'icons/icon-128.png','icons/icon-144.png','icons/icon-152.png','icons/icon-180.png',
              'icons/icon-192.png','icons/icon-384.png','icons/icon-512.png',
              'icons/icon-192-maskable.png','icons/icon-512-maskable.png','assets/fonts1989/manifest.json'
          ]
          missing=[p for p in required if not Path(p).is_file()]
          assert not missing, f'Missing production files: {missing}'

          index=Path('index.html').read_text(encoding='utf-8')
          app=Path('app.js').read_text(encoding='utf-8')
          css=Path('style.css').read_text(encoding='utf-8')
          sw=Path('service-worker.js').read_text(encoding='utf-8')
          assert sw==Path('sw.js').read_text(encoding='utf-8'), 'service workers diverged'
          assert './app.js?v=12.3.0' in index and './style.css?v=12.3.0' in index
          assert 'BUILD 12.3' in index and '<b>Build 12.3</b>' in index
          assert 'kira-build12-3-face-beauty-20260814' in sw
          assert 'service-worker.js?v=12.3.0' in app
          assert 'maximum-scale=1' in index and 'user-scalable=no' in index

          ids=re.findall(r'\bid="([^"]+)"',index)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'Duplicate DOM ids: {dup}'

          critical=[
              'startCamera','stopCamera','captureLivePhoto','startVideoRecording','stopVideoRecording',
              'renderRolls','openPhotoModal','safeOpenPhotoModal','applyBeautyPass','buildBeautyLayer',
              'detectBeautyFaceBox','renderLiveBeautyFrame','stopLiveBeautyPreview','setCameraControlsOpen',
              'toggleCameraImmersive','cleanupRetiredMotionPairs','draw1989Text','renderInstantCaptionBlob',
              'shareQueuedPhotos','saveAllCurrent','preventZoom'
          ]
          for fn in critical:
              assert re.search(rf'function\s+{re.escape(fn)}\s*\(',app), f'Missing critical function: {fn}'

          # The whole-video Beauty blur that caused the reported bug must be gone.
          live_match=re.search(r'function\s+applyLiveFilter\s*\(\)\{(.*?)\n\s*function\s+updateCameraViewport',app,re.S)
          assert live_match, 'applyLiveFilter block missing'
          live=live_match.group(1)
          assert 'beautyBlur' not in live, 'whole-frame Beauty blur returned'
          assert 'video.style.filter=cameraCssFromParams(p)' in live, 'base camera filter path changed unexpectedly'
          assert 'scheduleLiveBeautyPreview(0)' in live, 'face Beauty preview is not scheduled'
          assert 'id="liveBeautyCanvas"' in index, 'face Beauty canvas missing'
          assert css.count('.live-beauty-canvas')>=1, 'face Beauty canvas CSS missing'

          # Face-targeting / feature preservation / local healing must be in the saved-photo path.
          expected_tokens=[
              'detectBeautyFaceBox','beautyFaceWeight','featureKeep',
              "blemishTarget=clamp((colorDiff-2.5)/15",
              'acneMix=clamp(bl*mask',
              'rr+=(hr-rr)*acneMix',
              'rr-=excess*repair*.72',
              'lift=Math.max(0,healLum-outLum)*repair*.72',
              "buildBeautyLayer(ctx.canvas,beauty,920,'still')"
          ]
          for token in expected_tokens:
              assert token in app, f'Missing face Beauty token: {token}'

          # Live Beauty is intentionally bounded for performance and pauses while recording.
          assert 'const LIVE_BEAUTY_INTERVAL=145' in app
          assert 'longSide=260' in app and "buildBeautyLayer(source,liveBeauty,280,'live')" in app
          assert 'if(state.recording||document.hidden' in app
          assert app.count('navigator.mediaDevices.getUserMedia(constraints)')==1, 'unexpected extra camera stream path'
          assert index.count('id="liveBeautyCanvas"')==1, 'more than one live Beauty canvas'

          # Existing Camera controls fix must remain.
          assert 'id="cameraControlsCloseBtn"' in index and 'id="cameraControlsDoneBtn"' in index
          assert 'max-height:min(58dvh,640px)' in css and '.camera-controls-close-btn' in css

          # Retired Kira Live must stay gone.
          forbidden=['livePhotoBtn','photoLivePlayBtn','captureKiraLivePhoto','captureLiveMotionClip','toggleLivePhoto','livePhotoEnabled','liveCaptureBusy','live-roll-badge','Play Live']
          for token in forbidden:
              assert token not in app+index+css, f'Retired Live residue: {token}'

          glyph=json.loads(Path('assets/fonts1989/manifest.json').read_text(encoding='utf-8'))
          chars=set(glyph.keys()) if isinstance(glyph,dict) else set()
          expected=set('0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz')
          assert expected.issubset(chars), f'1989 glyph manifest missing: {sorted(expected-chars)}'
          for sample in ('1989','0123456789','ABCDEFGHIJKLMNOPQRSTUVWXYZ','abcdefghijklmnopqrstuvwxyz'):
              assert all(ch in chars for ch in sample), f'1989 sample failed: {sample}'

          manifest=json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          for icon in manifest.get('icons',[]):
              src=icon.get('src','').lstrip('./')
              assert Path(src).is_file(), f'Manifest icon missing: {src}'

          def png_size(path):
              data=Path(path).read_bytes()[:24]
              assert data[:8]==b'\x89PNG\r\n\x1a\n', f'Not PNG: {path}'
              return struct.unpack('>II',data[16:24])
          for size in (32,48,72,96,128,144,152,180,192,384,512):
              p=f'icons/icon-{size}.png'
              assert png_size(p)==(size,size), f'Wrong dimensions: {p}'
          assert png_size('icons/icon-192-maskable.png')==(192,192)
          assert png_size('icons/icon-512-maskable.png')==(512,512)
          print('Kira 12.3 face-targeted Beauty regression audit passed.')
          PY

      - name: PWA local HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m http.server 8765 >/tmp/kira-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          curl -fsS http://127.0.0.1:8765/index.html -o /tmp/kira-index.html
          curl -fsS http://127.0.0.1:8765/app.js -o /tmp/kira-app.js
          curl -fsS http://127.0.0.1:8765/style.css -o /tmp/kira-style.css
          curl -fsS http://127.0.0.1:8765/service-worker.js -o /tmp/kira-sw.js
          grep -q 'BUILD 12.3' /tmp/kira-index.html
          grep -q 'liveBeautyCanvas' /tmp/kira-index.html
          grep -q 'detectBeautyFaceBox' /tmp/kira-app.js
          grep -q 'LIVE_BEAUTY_INTERVAL=145' /tmp/kira-app.js
          ! grep -q 'beautyBlur' /tmp/kira-app.js
          grep -q 'live-beauty-canvas' /tmp/kira-style.css
          grep -q 'kira-build12-3-face-beauty-20260814' /tmp/kira-sw.js

      - name: Commit Kira 12.3 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Kira 12.3: add face-targeted beauty processing"
          git push origin HEAD:main
