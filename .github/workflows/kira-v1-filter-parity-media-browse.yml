name: Kira v1.0 filter parity + media browse

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply production patch
        run: python .github/scripts/kira_v1_filter_parity_media_swipe.py
      - name: QA filter parity, Mono, media browse, and critical regressions
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          cmp -s service-worker.js sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text()
          idx=Path('index.html').read_text()
          css=Path('style.css').read_text()
          sw=Path('service-worker.js').read_text()

          def need(x,msg):
              if not x: raise SystemExit(msg)

          # v1.0 + cache/version coherence
          need('v1.0' in idx,'public v1.0 missing')
          for s in ['manifest.json?v=1.0.6','style.css?v=1.0.6','app.js?v=1.0.6']:
              need(s in idx,f'missing {s}')
          need("service-worker.js?v=1.0.6" in app,'SW registration version mismatch')
          need("kira-v1-0-filter-parity-media-swipe-20260815" in sw,'cache bump missing')

          # Built-in library integrity.
          block=app.split('const builtins=[',1)[1].split('].map(([name,cat,c,p])',1)[0]
          names=re.findall(r"\['([^']+)'\s*,\s*'([^']+)'",block)
          need(len(names)==233,f'expected 233 built-ins, got {len(names)}')
          only=[n for n,c in names]
          need(len(only)==len(set(only)),'duplicate filter names')
          monos=[n for n,c in names if c=='Mono']
          need(len(monos)==10,f'expected 10 Mono filters, got {len(monos)}')

          # True Mono semantics: zero remains neutral; >0 remains grayscale after all overlays.
          need("function monoLookActive(f,intensity)" in app,'Mono helper missing')
          need("f.cat==='Mono'&&Number(intensity)>0" in app,'Mono threshold wrong')
          need("grayscale(100%)" in app,'live grayscale missing')
          need("function applyFinalMono" in app,'final canvas grayscale missing')
          need(app.count('if(p.mono)applyFinalMono(ctx,canvas,w,h)')>=2,'Mono final pass missing from Develop/capture')
          need('mono:monoLookActive(f,state.filterIntensity)' in app,'current Mono params missing')
          need('mono:monoLookActive(f,s.filterIntensity??100)' in app,'snapshot Mono params missing')

          # Live/captured core color parity.
          need('function applyPreviewToneToCanvas' in app,'shared preview tone helper missing')
          need("Math.min(.55,Number(p.castStrength)/100)" in app,'cast parity missing')
          need("Math.min(.28,Math.abs(warm)/115)" in app,'warmth parity missing')
          need("Math.min(.22,Math.abs(tint)/135)" in app,'tint parity missing')
          need("Math.min(.28,Math.max(0,p.fade||0)/130)" in app,'fade parity missing')
          need("Math.min(.62,Math.max(0,p.vignette||0)/58)" in app,'vignette parity missing')
          fast=app.split('function drawCameraShotFast',1)[1].split('async function processContinuousPhoto',1)[0]
          need('applyPreviewToneToCanvas(ctx,w,h,p)' in fast,'capture not using shared core tone')
          need('applyPresetCast(ctx,w,h,p)' not in fast,'capture still double-stacking cast')

          # Media Details browse feature.
          for id_ in ['photoMediaSwipeZone','photoPrevBtn','photoNextBtn','photoBrowseCount']:
              need(f'id="{id_}"' in idx,f'{id_} markup missing')
          for fn in ['modalBrowseItems','updatePhotoBrowseUi','navigatePhotoModal','bindPhotoModalBrowsing']:
              need(f'function {fn}' in app,f'{fn} missing')
          need('currentRollItems().filter' in app.split('function modalBrowseItems',1)[1].split('\n',1)[0],'browse order not tied to visible Roll')
          need('Math.abs(dx)<52' in app,'swipe threshold missing')
          need("e.key==='ArrowLeft'" in app and "e.key==='ArrowRight'" in app,'keyboard browse missing')
          need('state.photoModalDirty' in app,'media dirty-state protection missing')
          need("savePhotoDetails({reopen:false,quiet:true})" in app,'unsaved details protection missing')

          # Duplicate IDs.
          ids=re.findall(r'\bid="([^"]+)"',idx)
          dup=[x for x in set(ids) if ids.count(x)>1]
          need(not dup,f'duplicate DOM ids: {dup}')

          # Preserve critical systems.
          need("filterIntensity:50" in app,'50% filter default regressed')
          need('function deleteSelectedBulk' in app and 'bulkDeleteSelectedBtn' in idx,'bulk delete regressed')
          need('cameraFlashBtn' in idx and 'prepareCaptureFlash' in app,'capture flash regressed')
          need(".live-beauty-canvas{display:none!important;opacity:0!important}" in css,'capture-safe Beauty regressed')
          need('applyBeautyPass(ctx,w,h,state.beauty)' in app,'captured still Beauty missing')
          need(app.count('getUserMedia(constraints)')==1,'video camera stream call count changed')
          need(app.count('getUserMedia({audio:')==1,'optional audio stream call count changed')
          need('kira.livePhoto' in app and 'motionBlob' in app,'retired motion cleanup missing')

          # PWA/mobile basics.
          need('maximum-scale=1' in idx and 'user-scalable=no' in idx,'zoom prevention viewport missing')
          need('function preventZoom' in app,'programmatic zoom prevention missing')
          need('assets/fonts1989/manifest.json' in sw,'1989 Sparkle shell asset missing')
          print('QA PASS: 233 filters, true Mono, camera/capture core parity, Media Details swipe, critical regressions')
          PY
          git diff --check
      - name: Commit production update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html style.css service-worker.js sw.js
          git commit -m "Kira v1.0: match camera filters and add media browsing"
          git push origin main
